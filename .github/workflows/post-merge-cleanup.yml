name: Post-Merge Lifecycle & Vercel Cleanup

on:
  pull_request:
    types: [closed]
    branches:
      - main

permissions:
  contents: write
  pull-requests: read
  statuses: read
  deployments: read

jobs:
  cleanup-and-verify:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - name: 1. Delete Head Branch
        uses: actions/github-script@v7
        with:
          script: |
            const branch = context.payload.pull_request.head.ref;
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            console.log(`Checking branch '${branch}' for repository '${owner}/${repo}'...`);
            try {
              await github.rest.git.deleteRef({
                owner,
                repo,
                ref: `heads/${branch}`,
              });
              console.log(`Successfully deleted branch '${branch}'.`);
            } catch (err) {
              if (err.status === 422 || err.status === 404) {
                console.log(`Branch '${branch}' is already deleted or not found.`);
              } else {
                console.warn(`Could not delete branch '${branch}':`, err.message);
              }
            }

      - name: 2. Monitor Vercel Production Deployment
        uses: actions/github-script@v7
        with:
          script: |
            const sha = context.payload.pull_request.merge_commit_sha;
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            console.log(`Monitoring Vercel production build for commit ${sha}...`);
            
            const maxWaitMs = 5 * 60 * 1000;
            const intervalMs = 10 * 1000;
            const startTime = Date.now();

            while (Date.now() - startTime < maxWaitMs) {
              const { data: statuses } = await github.rest.repos.listCommitStatusesForRef({
                owner,
                repo,
                ref: sha,
              });

              const vercelStatus = statuses.find(s => s.context === 'Vercel' || s.context?.toLowerCase().includes('vercel'));
              if (vercelStatus) {
                console.log(`Current Vercel status: ${vercelStatus.state} - ${vercelStatus.description}`);
                if (vercelStatus.state === 'success') {
                  console.log('Production deployment is READY and LIVE on Vercel!');
                  return;
                } else if (vercelStatus.state === 'failure' || vercelStatus.state === 'error') {
                  core.setFailed(`Vercel production build failed: ${vercelStatus.description}`);
                  return;
                }
              } else {
                console.log('Waiting for Vercel deployment status webhook...');
              }
              await new Promise(r => setTimeout(r, intervalMs));
            }
            console.log('Timed out waiting for Vercel deployment status in GitHub checks (build may still be completing in background).');

      - name: 3. Purge Stale Vercel Preview Deployments
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_TEAM_ID: ${{ secrets.VERCEL_TEAM_ID || 'team_MuF5l0DGFjH4jj1fNRr6JHMw' }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID || 'prj_LuOdhNWavQGOFQxtMtoWVeaDJVsa' }}
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "::notice ::VERCEL_TOKEN secret is not set in GitHub repository secrets. Stale preview branches are deactivated when branches are deleted. To enable automatic hard deletion of preview deployments, add VERCEL_TOKEN to GitHub repository secrets."
            exit 0
          fi

          BRANCH="${{ github.event.pull_request.head.ref }}"
          echo "Querying preview deployments for branch: $BRANCH"

          DEPLOYMENTS=$(curl -s -H "Authorization: Bearer $VERCEL_TOKEN" \
            "https://api.vercel.com/v6/deployments?projectId=$VERCEL_PROJECT_ID&teamId=$VERCEL_TEAM_ID&limit=20")

          node -e '
            const data = JSON.parse(process.argv[1]);
            const branch = process.argv[2];
            const token = process.env.VERCEL_TOKEN;
            const teamId = process.env.VERCEL_TEAM_ID;

            if (!data.deployments) {
              console.log("No deployments found or invalid response:", data);
              process.exit(0);
            }

            const toDelete = data.deployments.filter(d => 
              d.target !== "production" && 
              (d.meta?.githubCommitRef === branch || d.meta?.githubPrId === "${{ github.event.pull_request.number }}")
            );

            console.log(`Found ${toDelete.length} preview deployment(s) matching branch "${branch}".`);

            async function purge() {
              for (const dep of toDelete) {
                console.log(`Deleting preview deployment ${dep.uid} (${dep.url})...`);
                const res = await fetch(`https://api.vercel.com/v13/deployments/${dep.uid}?teamId=${teamId}`, {
                  method: "DELETE",
                  headers: { Authorization: "Bearer " + token }
                });
                const resData = await res.json();
                console.log(`Deleted ${dep.uid}: status ${res.status}`, resData);
              }
            }
            purge().catch(err => console.error(err));
          ' "$DEPLOYMENTS" "$BRANCH"
