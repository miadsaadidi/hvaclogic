<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#070a12" />
    </linearGradient>

    <!-- Cooling Cyan Gradient -->
    <linearGradient id="coolGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#00d2ff" />
    </linearGradient>

    <!-- Heating Amber Gradient -->
    <linearGradient id="heatGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff8c42" />
      <stop offset="100%" stop-color="#ff4500" />
    </linearGradient>

    <!-- Inner Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base Rounded Shield -->
  <rect width="64" height="64" rx="14" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="1.5" />

  <!-- Outer Precision Ring -->
  <circle cx="32" cy="32" r="23" stroke="#334155" stroke-width="1" stroke-dasharray="2 3" opacity="0.6" />

  <!-- Dual Thermodynamic Vortex: Cooling Arc (Left/Top) & Heating Arc (Right/Bottom) -->
  <!-- Cooling Wave / Airflow Blade -->
  <path
    d="M 21 16 C 28 14 38 18 42 25 C 38 23 32 23 27 27 C 23 30 20 36 21 42 C 17 37 16 28 21 16 Z"
    fill="url(#coolGrad)"
    filter="url(#glow)"
  />

  <!-- Heating Flame / Energy Blade -->
  <path
    d="M 43 48 C 36 50 26 46 22 39 C 26 41 32 41 37 37 C 41 34 44 28 43 22 C 47 27 48 36 43 48 Z"
    fill="url(#heatGrad)"
    filter="url(#glow)"
  />

  <!-- Center Logic Core Node -->
  <circle cx="32" cy="32" r="4.5" fill="#ffffff" />
  <circle cx="32" cy="32" r="2.5" fill="#00d2ff" />
</svg>
